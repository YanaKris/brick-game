services:
  brickgame-cli:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    working_dir: /app/src
    command: ["./brickgame"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/src
    command: sh -c "make test && make gcov_report"

  brickgame-qt:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["qt"]
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /app/src/gui/desktop
    command: sh -c "qmake game_menu.pro && make && ./game_menu"
