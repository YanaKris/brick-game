name: CI

on:
  push:
    branches: [main, release-v1, 'feat/**', 'refactor/**', 'fix/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check style (Google, --Werror)
        run: make -C src style

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev libgtest-dev
      - name: Build GoogleTest static libs
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest
          cmake --build /tmp/gtest -j"$(nproc)"
          sudo find /tmp/gtest -name '*.a' -exec cp {} /usr/lib \;
      - name: Build (make all)
        run: make -C src all
      - name: Run tests (make test)
        run: make -C src test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev libgtest-dev lcov
      - name: Build GoogleTest static libs
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest
          cmake --build /tmp/gtest -j"$(nproc)"
          sudo find /tmp/gtest -name '*.a' -exec cp {} /usr/lib \;
      - name: Coverage report (make gcov_report)
        run: make -C src gcov_report
      - name: Enforce >= 80% line coverage
        run: |
          summary=$(lcov --summary src/coverage.info 2>&1)
          echo "$summary"
          pct=$(echo "$summary" | sed -n 's/.*lines\.*: \([0-9.]*\)%.*/\1/p')
          if [ -z "$pct" ]; then
            echo "FAIL: could not parse line coverage"
            exit 1
          fi
          echo "Line coverage: ${pct}%"
          awk "BEGIN { if (${pct} < 80) { print \"FAIL: line coverage below 80%\"; exit 1 } }"

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev libgtest-dev valgrind
      - name: Build GoogleTest static libs
        run: |
          cmake -S /usr/src/googletest -B /tmp/gtest
          cmake --build /tmp/gtest -j"$(nproc)"
          sudo find /tmp/gtest -name '*.a' -exec cp {} /usr/lib \;
      - name: Valgrind (make valgrind)
        run: make -C src valgrind
